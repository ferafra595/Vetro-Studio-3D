# Verifica moduli DWG / STEP locali su main dopo pubblicazione degli asset
name: Verifica importazione CAD
on:
  push:
    branches: [main]
    paths:
      - 'public/dwg-browser-import.js'
      - 'public/technical-accessories.js'
      - 'public/cad-browser-import.js'
      - 'tests/**'
      - 'public/vendor/**'
      - '.github/workflows/test-cad.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintassi JavaScript
        run: |
          node --check public/dwg-browser-import.js
          node --check public/cad-browser-import.js
          node --check public/technical-accessories.js
      - name: Test di sicurezza geometrica DWG
        run: node --test tests/dwg-import.test.cjs
      - name: Verifica la presenza delle librerie CAD locali
        run: |
          test -s public/vendor/libredwg/wasm/libredwg-web.wasm
          test -s public/vendor/libredwg/wasm/libredwg-web.js
          test -s public/vendor/libredwg/dist/libredwg-web.js
          test -s public/vendor/occt/occt-import-js.wasm
          test -s public/vendor/occt/occt-import-js.js
      - name: Installa browser smoke runner
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Esegui i motori WASM nel browser
        run: node tests/cad-browser-smoke.cjs
